name: CloseSpan current-issue verifier
run-name: CloseSpan verification ${{ inputs.closespan_run_id }}

on:
  workflow_dispatch:
    inputs:
      closespan_run_id:
        required: true
        type: string
      closespan_org_id:
        required: true
        type: string
      closespan_callback_url:
        required: true
        type: string
      closespan_profile_hash:
        required: true
        type: string
      closespan_workflow_hash:
        required: true
        type: string
      closespan_control_runner_label:
        required: true
        type: string
      closespan_runner_label:
        required: true
        type: string

permissions: {}

concurrency:
  group: closespan-runtime-verification-${{ inputs.closespan_run_id }}
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Fetch immutable verification job
    runs-on: ${{ inputs.closespan_control_runner_label }}
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - name: Fetch job from CloseSpan
        env:
          CALLBACK_URL: ${{ inputs.closespan_callback_url }}
          ORG_ID: ${{ inputs.closespan_org_id }}
          RUN_ID: ${{ inputs.closespan_run_id }}
          PROFILE_HASH: ${{ inputs.closespan_profile_hash }}
          WORKFLOW_HASH: ${{ inputs.closespan_workflow_hash }}
        run: |
          set -euo pipefail
          oidc_json="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=closespan-agent-run")"
          oidc_token="$(OIDC_JSON="$oidc_json" node -e 'process.stdout.write(JSON.parse(process.env.OIDC_JSON).value)')"
          echo "::add-mask::$oidc_token"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $oidc_token" \
            "$CALLBACK_URL?orgId=$ORG_ID" \
            --output closespan-runtime-job.json
          JOB_PATH="$PWD/closespan-runtime-job.json" RUN_ID="$RUN_ID" PROFILE_HASH="$PROFILE_HASH" WORKFLOW_HASH="$WORKFLOW_HASH" node <<'NODE'
          const fs = require("node:fs");
          const job = JSON.parse(fs.readFileSync(process.env.JOB_PATH, "utf8"));
          if (job.schemaVersion !== 1 || job.kind !== "issue_runtime_verification") throw new Error("CloseSpan runtime job schema mismatch");
          if (job.runId !== process.env.RUN_ID) throw new Error("CloseSpan runtime job identity mismatch");
          if (job.executionProfileHash !== process.env.PROFILE_HASH) throw new Error("CloseSpan profile hash mismatch");
          if (job.workflowHash !== process.env.WORKFLOW_HASH) throw new Error("CloseSpan workflow hash mismatch");
          if (job.baseSha.toLowerCase() !== process.env.GITHUB_SHA.toLowerCase()) throw new Error("CloseSpan base commit mismatch");
          if (new Date(job.expiresAt).getTime() <= Date.now()) throw new Error("CloseSpan runtime verification expired");
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: closespan-runtime-job
          path: closespan-runtime-job.json
          if-no-files-found: error
          retention-days: 1

  verify:
    name: Reproduce reported issue
    needs: bootstrap
    runs-on: ${{ inputs.closespan_runner_label }}
    timeout-minutes: 70
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: closespan-runtime-job
          path: .closespan-run
      - name: Prepare approved runtime environment
        id: prepare
        run: |
          set -euo pipefail
          node <<'NODE'
          const cp = require("node:child_process");
          const fs = require("node:fs");
          const path = require("node:path");
          const job = JSON.parse(fs.readFileSync(".closespan-run/closespan-runtime-job.json", "utf8"));
          const config = job.executionProfileSnapshot.config;
          const safe = value => typeof value === "string" && value.length > 0 && !path.isAbsolute(value) && !value.split(/[\\/]/).includes("..");
          if (config.workingDirectory !== "." && !safe(config.workingDirectory)) throw new Error("Unsafe runtime working directory");
          fs.writeFileSync(".closespan-run/runtime-verification.prompt.md", job.verificationPrompt);
          fs.writeFileSync(".closespan-run/runtime-verification.json", JSON.stringify({
            schemaVersion: 1,
            runId: job.runId,
            baseSha: job.baseSha,
            outcome: "Verification blocked",
            summary: "The runtime verifier started but did not complete a decisive product check.",
            expectedBehavior: "The reported product path should complete with the expected behavior.",
            actualBehavior: "The verifier was interrupted before it recorded a decisive result.",
            reproductionSteps: ["Started the repository-scoped runtime verification plan."],
            commands: [],
            observations: ["A provisional report was created before runtime execution and must be replaced or updated by the verifier."],
            artifacts: [],
          }));
          for (const item of config.publicEnvironment) {
            const delimiter = `CLOSESPAN_${require("node:crypto").randomBytes(12).toString("hex")}`;
            fs.appendFileSync(process.env.GITHUB_ENV, `${item.name}<<${delimiter}\n${item.value}\n${delimiter}\n`);
          }
          for (const command of config.installCommands) {
            const result = cp.spawnSync("/bin/bash", ["-lc", command], { cwd: config.workingDirectory, stdio: "inherit", timeout: config.maxDurationMs });
            if (result.status !== 0) process.exit(result.status ?? 1);
          }
          const mobile = job.runner;
          if (mobile.xcode) {
            const result = cp.spawnSync("xcodebuild", ["-version"], { encoding: "utf8" });
            const output = `${result.stdout}${result.stderr}`;
            const installed = /Xcode\s+(\d+(?:\.\d+)?)/.exec(output)?.[1]?.split(".").map(Number);
            const required = mobile.xcode.version.split(".").map(Number);
            const compatible = installed && (installed[0] > required[0] || (installed[0] === required[0] && (installed[1] || 0) >= (required[1] || 0)));
            if (result.status !== 0 || !compatible) throw new Error(`The runtime requires Xcode ${mobile.xcode.version} or newer; this runner reported ${output.trim() || "no Xcode"}`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, "working-directory=.\n");
          NODE
      - name: Prepare iOS Simulator harness
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p .closespan-run/artifacts .closespan-run/bin

          simulator_json=""
          for attempt in 1 2 3; do
            if simulator_json="$(xcrun simctl list devices available -j 2>.closespan-run/artifacts/simctl-error.log)" && \
               SIMULATOR_JSON="$simulator_json" node -e 'const value=JSON.parse(process.env.SIMULATOR_JSON); process.exit(Object.values(value.devices || {}).flat().some(device => device.isAvailable && device.name.startsWith("iPhone")) ? 0 : 1)'; then
              break
            fi
            killall -9 com.apple.CoreSimulator.CoreSimulatorService 2>/dev/null || true
            sleep $((attempt * 2))
          done

          simulator="$(SIMULATOR_JSON="$simulator_json" node <<'NODE'
          const value = JSON.parse(process.env.SIMULATOR_JSON || "{}");
          const devices = Object.values(value.devices || {}).flat().filter(device => device.isAvailable && device.name.startsWith("iPhone"));
          const selected = devices.find(device => device.name === "iPhone 16") || devices[0];
          if (!selected) throw new Error("The approved macOS runner has no available iPhone Simulator device");
          process.stdout.write(`${selected.udid}\t${selected.name}`);
          NODE
          )"
          simulator_udid="${simulator%%$'\t'*}"
          simulator_name="${simulator#*$'\t'}"
          xcrun simctl boot "$simulator_udid" 2>/dev/null || true
          xcrun simctl bootstatus "$simulator_udid" -b

          {
            echo "CLOSESPAN_IOS_SIMULATOR_UDID=$simulator_udid"
            echo "CLOSESPAN_IOS_SIMULATOR_NAME=$simulator_name"
            echo "CLOSESPAN_IOS_SIMULATOR_HARNESS=$GITHUB_WORKSPACE/.closespan-run/bin/ios-simulator"
          } >> "$GITHUB_ENV"

          cat > .closespan-run/bin/ios-simulator <<'HARNESS'
          #!/usr/bin/env bash
          set -euo pipefail
          udid="${CLOSESPAN_IOS_SIMULATOR_UDID:?CLOSESPAN_IOS_SIMULATOR_UDID is not set}"
          case "${1:-status}" in
            status) xcrun simctl list devices booted ;;
            install) xcrun simctl install "$udid" "${2:?usage: ios-simulator install APP_PATH}" ;;
            launch) xcrun simctl launch "$udid" "${2:?usage: ios-simulator launch BUNDLE_ID}" ;;
            terminate) xcrun simctl terminate "$udid" "${2:?usage: ios-simulator terminate BUNDLE_ID}" ;;
            openurl) xcrun simctl openurl "$udid" "${2:?usage: ios-simulator openurl URL}" ;;
            screenshot)
              output="${2:?usage: ios-simulator screenshot OUTPUT_PATH}"
              xcrun simctl io "$udid" screenshot "$output"
              # Simulator PNGs can exceed the scoped model gateway request limit.
              # Preserve useful visual evidence while keeping subsequent agent turns bounded.
              sips --resampleHeightWidthMax 960 "$output" >/dev/null
              ;;
            *) echo "usage: ios-simulator {status|install|launch|terminate|openurl|screenshot}" >&2; exit 64 ;;
          esac
          HARNESS
          chmod +x .closespan-run/bin/ios-simulator
          SIMULATOR_UDID="$simulator_udid" SIMULATOR_NAME="$simulator_name" node <<'NODE'
          const fs = require("node:fs");
          fs.writeFileSync(".closespan-run/artifacts/ios-simulator.json", JSON.stringify({
            udid: process.env.SIMULATOR_UDID,
            name: process.env.SIMULATOR_NAME,
            state: "Booted",
          }, null, 2));
          NODE
      - name: Mark verification running
        env:
          CALLBACK_URL: ${{ inputs.closespan_callback_url }}
          ORG_ID: ${{ inputs.closespan_org_id }}
        run: |
          set -euo pipefail
          oidc_json="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=closespan-agent-run")"
          oidc_token="$(OIDC_JSON="$oidc_json" node -e 'process.stdout.write(JSON.parse(process.env.OIDC_JSON).value)')"
          echo "::add-mask::$oidc_token"
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $oidc_token" -H "Content-Type: application/json" \
            --data "{\"event\":\"started\",\"orgId\":\"$ORG_ID\"}" "$CALLBACK_URL"
      - name: Obtain run-scoped model access
        id: model
        env:
          CALLBACK_URL: ${{ inputs.closespan_callback_url }}
          ORG_ID: ${{ inputs.closespan_org_id }}
        run: |
          set -euo pipefail
          oidc_json="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=closespan-agent-run")"
          oidc_token="$(OIDC_JSON="$oidc_json" node -e 'process.stdout.write(JSON.parse(process.env.OIDC_JSON).value)')"
          echo "::add-mask::$oidc_token"
          model_json="$(curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $oidc_token" -H "Content-Type: application/json" \
            --data "{\"orgId\":\"$ORG_ID\"}" "$CALLBACK_URL/model-token")"
          MODEL_JSON="$model_json" node <<'NODE'
          const fs = require("node:fs");
          const value = JSON.parse(process.env.MODEL_JSON);
          if (typeof value.token !== "string" || typeof value.model !== "string" || typeof value.responsesApiEndpoint !== "string") throw new Error("CloseSpan returned an invalid model credential");
          process.stdout.write(`::add-mask::${value.token}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `token=${value.token}\nmodel=${value.model}\nendpoint=${value.responsesApiEndpoint}\n`);
          NODE
      - name: Run current-issue verifier
        id: codex
        continue-on-error: true
        uses: openai/codex-action@b11346a6fa031e2e164ab4b7c7ea201afffd7d59
        with:
          openai-api-key: ${{ steps.model.outputs.token }}
          responses-api-endpoint: ${{ steps.model.outputs.endpoint }}
          model: ${{ steps.model.outputs.model }}
          prompt-file: .closespan-run/runtime-verification.prompt.md
          working-directory: ${{ steps.prepare.outputs.working-directory }}
          # CoreSimulator and package resolution require host services that the macOS
          # Seatbelt workspace sandbox blocks. This remains an ephemeral runner with
          # no persisted checkout credential, read-only repository permission, and no sudo.
          sandbox: ${{ runner.os == 'macOS' && 'danger-full-access' || 'workspace-write' }}
          safety-strategy: drop-sudo
          allow-bot-users: ${{ github.actor }}
      - name: Validate and attest verification report
        if: always()
        env:
          RUNNER_LABEL: ${{ inputs.closespan_runner_label }}
          CODEX_OUTCOME: ${{ steps.codex.outcome }}
        run: |
          node <<'NODE'
          const cp = require("node:child_process");
          const fs = require("node:fs");
          const job = JSON.parse(fs.readFileSync(".closespan-run/closespan-runtime-job.json", "utf8"));
          const reportPath = ".closespan-run/runtime-verification.json";
          let report;
          try { report = JSON.parse(fs.readFileSync(reportPath, "utf8")); }
          catch { report = { schemaVersion: 1, runId: job.runId, baseSha: job.baseSha, outcome: "Verification blocked", summary: "The Tenki verification agent did not produce a valid runtime report.", expectedBehavior: "The reported product path should complete with the expected behavior.", actualBehavior: `Verifier outcome: ${process.env.CODEX_OUTCOME || "unknown"}.`, reproductionSteps: ["Attempted the repository-scoped runtime verification plan."], commands: [], observations: ["No parseable runtime report was produced."], artifacts: [] }; }
          const allowed = new Set(["Confirmed current", "Not reproduced", "Verification blocked"]);
          const strings = [report.summary, report.expectedBehavior, report.actualBehavior];
          if (report.schemaVersion !== 1 || report.runId !== job.runId || report.baseSha !== job.baseSha || !allowed.has(report.outcome) || strings.some(value => typeof value !== "string" || !value.trim())) throw new Error("Runtime verification report failed identity or outcome validation");
          if (!Array.isArray(report.reproductionSteps) || !report.reproductionSteps.length || !Array.isArray(report.commands) || !Array.isArray(report.observations) || !Array.isArray(report.artifacts)) throw new Error("Runtime verification report is incomplete");
          const changed = cp.execFileSync("git", ["status", "--short"], { encoding: "utf8" }).split("\n").filter(line => line && !line.includes(".closespan-run/"));
          if (changed.length) report.observations.push(`Ephemeral verifier changes (not pushed): ${changed.slice(0, 30).join(", ")}`);
          const xcode = cp.spawnSync("xcodebuild", ["-version"], { encoding: "utf8" });
          const devices = process.platform === "darwin" ? cp.spawnSync("xcrun", ["simctl", "list", "devices", "booted", "-j"], { encoding: "utf8" }) : { status: 1, stdout: "" };
          report.environment = { platform: process.platform === "darwin" ? "macos" : process.platform, runnerLabel: process.env.RUNNER_LABEL, xcodeVersion: xcode.status === 0 ? xcode.stdout.trim().slice(0, 120) : null, simulator: devices.status === 0 ? devices.stdout.trim().slice(0, 200) : null, workflowRunId: Number(process.env.GITHUB_RUN_ID) };
          fs.writeFileSync(reportPath, JSON.stringify(report));
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: closespan-runtime-verification
          path: |
            .closespan-run/runtime-verification.json
            .closespan-run/artifacts
          if-no-files-found: error
          retention-days: 7

  callback:
    name: Return runtime evidence to CloseSpan
    needs: [bootstrap, verify]
    if: always()
    runs-on: ${{ inputs.closespan_control_runner_label }}
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        continue-on-error: true
        with:
          name: closespan-runtime-verification
          path: .closespan-run
      - name: Return authenticated result
        env:
          CALLBACK_URL: ${{ inputs.closespan_callback_url }}
          ORG_ID: ${{ inputs.closespan_org_id }}
          BOOTSTRAP_RESULT: ${{ needs.bootstrap.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          set -euo pipefail
          mkdir -p .closespan-run
          node <<'NODE'
          const fs = require("node:fs");
          const path = ".closespan-run/runtime-verification.json";
          const failedStage = process.env.BOOTSTRAP_RESULT === "failure"
            ? "The verifier could not fetch its approval-bound CloseSpan job."
            : process.env.VERIFY_RESULT === "failure"
              ? "The Tenki runner stopped before producing runtime verification evidence."
              : "The Tenki runner did not produce runtime verification evidence.";
          const payload = fs.existsSync(path)
            ? { event: "completed", orgId: process.env.ORG_ID, report: JSON.parse(fs.readFileSync(path, "utf8")) }
            : { event: "failed", orgId: process.env.ORG_ID, message: failedStage };
          fs.writeFileSync(".closespan-run/callback.json", JSON.stringify(payload));
          NODE
          oidc_json="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=closespan-agent-run")"
          oidc_token="$(OIDC_JSON="$oidc_json" node -e 'process.stdout.write(JSON.parse(process.env.OIDC_JSON).value)')"
          echo "::add-mask::$oidc_token"
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $oidc_token" -H "Content-Type: application/json" \
            --data-binary @.closespan-run/callback.json "$CALLBACK_URL"
