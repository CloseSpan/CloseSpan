services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: feedbackflow
      POSTGRES_USER: feedbackflow
      POSTGRES_PASSWORD: feedbackflow_local
    ports:
      - "5432:5432"
    volumes:
      - feedbackflow_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedbackflow -d feedbackflow"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  feedbackflow_postgres:
